<!doctype html><html lang="fr" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html{--police:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,sans-serif}
html[data-theme="light"]{--bg:#f2f2f4;--s1:#fff;--s2:#efeff2;--s3:#e1e1e6;--s-fen:#fff;--ligne:rgba(0,0,0,.075);--text:#0b0b0c;--text-muted:#5f5f67;--inv:#0b0b0c;--sur-inv:#fff}
html[data-theme="dark"]{--bg:#0a0a0b;--s1:#161618;--s2:#222225;--s3:#2e2e33;--s-fen:#1c1c1f;--ligne:rgba(255,255,255,.075);--text:#f5f5f7;--text-muted:#9b9ba2;--inv:#f5f5f7;--sur-inv:#0a0a0b}
html,body{margin:0;height:100%}body{background:var(--bg);color:var(--text);font-family:var(--police)}#scene{position:absolute;inset:0}
</style></head>
<body><div id="scene"></div><script src="atlas3d.js"></script><script>
const q = new URLSearchParams(location.search);
const clair = !!q.get('clair'); document.documentElement.dataset.theme = clair ? 'light' : 'dark';
// La peau est chargée comme dans l'appli (&peau=0 pour s'en passer).
Promise.all([fetch('../donnees/atlas.bin').then(r => r.arrayBuffer()), q.get('peau') === '0' ? null : fetch('../donnees/atlas-peau.bin').then(r => r.ok ? r.arrayBuffer() : null).catch(() => null)]).then(([t, peau]) => {
  const m = window.monte = AnqaAtlas.monter(document.getElementById('scene'), t, {
    clair, peau, modes: [{ id: 'semaine', nom: 'Semaine' }, { id: 'anatomie', nom: 'Anatomie' }, { id: 'frequence', nom: 'Fréquence' }, { id: 'priorites', nom: 'Priorités' }], mode: q.get('mode') || 'anatomie',
    carte: (mode, S) => mode === 'anatomie' ? {} : { muscle: clair ? '#c9c9d1' : '#56565e', tendon: clair ? '#e4e4ea' : '#8a8a92', os: clair ? '#dcdce2' : '#77777f', tendons: 0.35, couleurs: Object.fromEntries(S.filter(s => s.app.length).map(s => [s.id, ['#6b7385', '#4f7cff', '#c5e34a', '#10b981', '#ff453a'][(s.id.length * 7) % 5]])), legende: [{ c: '#6b7385', t: 'Trop peu' }, { c: '#4f7cff', t: 'Entretien' }, { c: '#c5e34a', t: 'Progression' }, { c: '#10b981', t: 'Zone idéale' }, { c: '#ff453a', t: 'Trop' }], note: 'Couleurs de démonstration (page d’essai)' },
    fiche: (s, mode) => s.app.length ? '<b>' + s.app.map(a => a.groupe + (a.faisceau ? ' · ' + a.faisceau : '') + ' (' + a.role + ')').join(', ') + '</b>' : 'Pas de suivi dédié dans Anqā.',
    groupe: s => s.app.length ? { nom: s.app[0].groupe, ids: m.atlas.structures.filter(x => x.app.some(a => a.groupe === s.app[0].groupe)).map(x => x.id) } : null
  });
  const a = m.atlas;
  const cam = {}; ['az', 'el', 'dist'].forEach(k => { if (q.get(k) != null) cam[k] = +q.get(k); });
  if (Object.keys(cam).length) a.placer(cam);
  if (q.get('niveau') != null) m.niveauPeau(+q.get('niveau'));
  if (q.get('couche')) m.couche(+q.get('couche'));
  if (q.get('fantomes') === '0') a.fantomes(false);
  if (q.get('choisi')) m.choisir(q.get('choisi'), { cadrer: !!q.get('cadrer') });
  if (q.get('index')) m.ouvrirIndex(true);
  setTimeout(() => { window.pret = true; }, +(q.get('attente') || 900));
}).catch(e => { document.body.textContent = String(e && e.stack || e); window.pret = true; window.erreur = String(e); });
</script></body></html>
